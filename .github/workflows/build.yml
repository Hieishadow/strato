# A workflow to verify the build on every push to the master branch
name: Build

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore src from STORM_SWITCH with NVDEC fix
        run: |
          rm -rf src
          git clone --depth 1 https://github.com/ReiKatari/STORM_SWITCH.git /tmp/storm
          mv /tmp/storm/src ./src
          rm -rf /tmp/storm
          ls src/core/hle/service/nvdrv/devices/nvhost_nvdec.cpp
          # FIX #17 - Shader STUBBED (crash Luigi's / fatal error)
          sed -i 's/#.*shader_recompiler/add_subdirectory(shader_recompiler)/' src/video_core/CMakeLists.txt
          grep -q "add_subdirectory(shader_recompiler)" src/video_core/CMakeLists.txt || echo "add_subdirectory(shader_recompiler)" >> src/video_core/CMakeLists.txt
          echo "Shader fix aplicado:"
          cat src/video_core/CMakeLists.txt | grep shader_recompiler

      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi
          
      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('app/**/*.xml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('app/**/*.xml') }}-
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-
            ${{ runner.os }}-gradle-

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      - name: Android Assemble
        env:
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
          CCACHE_COMPILERCHECK: "string:${{ env.NDK_VERSION }}"
        run: ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Strato-APK
          path: |
            **/build/outputs/apk/**/*.apk
            **/*.apk
